<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DzDesign Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Segoe UI',sans-serif;background:#f6f7fb;color:#171923}button,input{font:inherit}header{height:66px;background:white;border-bottom:1px solid #e8e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px}.logo{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,#7c3aed,#ec4899)}.brand b{font-size:20px}.tag{font-size:11px;background:#f1eaff;color:#6d28d9;padding:4px 7px;border-radius:20px}.download{border:0;background:#7c3aed;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.workspace{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 66px)}aside{background:white;border-left:1px solid #e6e7ec;padding:20px}h3{font-size:14px;margin:16px 0 9px}.templates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tpl{border:1px solid #e2e4ea;background:#fff;border-radius:10px;padding:7px;cursor:pointer}.thumb{height:58px;border-radius:7px;margin-bottom:6px}.field{width:100%;border:1px solid #d9dbe3;border-radius:9px;padding:10px;margin-bottom:8px;outline:none}.colors{display:flex;flex-wrap:wrap;gap:8px}.color{width:31px;height:31px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ddd;cursor:pointer}.upload{display:block;margin-top:16px;text-align:center;background:#f3f0ff;color:#6d28d9;padding:11px;border-radius:10px;font-weight:700;cursor:pointer}.upload input{display:none}.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}.canvasWrap{width:min(68vw,620px);aspect-ratio:1;box-shadow:0 22px 60px #27273d29;background:#ddd}.canvasWrap canvas{width:100%;height:100%;display:block}.hint{font-size:12px;color:#777e8d;margin-top:14px}.tiny{font-size:12px;color:#8b91a0;line-height:1.45;margin-top:14px}@media(max-width:760px){header{padding:0 11px}.tag{display:none}.workspace{display:flex;flex-direction:column}.stage{order:1;padding:14px}.canvasWrap{width:92vw}aside{order:2;border:0;border-top:1px solid #e6e7ec}.templates{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class='brand'><span class='logo'>D</span><b>DzDesign</b><span class='tag'>Demo</span></div><button class='download' id='download'>تحميل PNG</button></header><div class='workspace'><aside><h3>القوالب الجاهزة</h3><div class='templates' id='templates'></div><h3>تعديل النص</h3><input class='field' id='title' value='صمّم فكرتك'><input class='field' id='subtitle' value='أنشئ منشورك في ثوانٍ'><h3>لون الخلفية</h3><div class='colors' id='colors'></div><label class='upload'>+ أضف صورة<input type='file' id='image' accept='image/*'></label><div class='tiny'>نسخة تجريبية: قوالب + نصوص + ألوان + رفع صورة + تنزيل التصميم.</div></aside><section class='stage'><div class='canvasWrap'><canvas id='canvas' width='1080' height='1080'></canvas></div><div class='hint'>1080 × 1080 • مناسب لـ Facebook و Instagram</div></section></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let bg1='#7c3aed',bg2='#ec4899',img=null;
const templates=[['عرض خاص','#6d5dfc','#a55eea','عرض خاص','خصم 30% اليوم فقط'],['مطعم','#ff7a18','#af002d','وجبتك المفضلة','اطلب الآن واستمتع بالمذاق'],['متجر','#00b09b','#96c93d','وصل الجديد!','تشكيلة جديدة بأسعار رائعة'],['خدمة','#2563eb','#06b6d4','خدمة احترافية','حلول ذكية لعملك اليوم']];
function escText(s){return s||''}function draw(){let g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,bg1);g.addColorStop(1,bg2);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);if(img){let r=Math.max(1080/img.width,1080/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,(1080-w)/2,(1080-h)/2,w,h)}let shade=ctx.createLinearGradient(0,250,0,1080);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(0,0,0,.62)');ctx.fillStyle=shade;ctx.fillRect(0,0,1080,1080);ctx.textAlign='right';ctx.direction='rtl';ctx.fillStyle='rgba(255,255,255,.18)';roundRect(ctx,760,665,210,60,30,true);ctx.font='bold 25px Arial';ctx.fillStyle='white';ctx.fillText('تصميمك',935,705);ctx.font='bold 78px Arial';wrap(ctx,escText(title.value),935,800,850,90);ctx.font='36px Arial';ctx.fillStyle='white';ctx.fillText(escText(subtitle.value),935,920);ctx.fillStyle='white';roundRect(ctx,720,960,215,67,14,true);ctx.font='bold 26px Arial';ctx.fillStyle='#111827';ctx.fillText('اكتشف المزيد',900,1004)}
function roundRect(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);if(fill)c.fill()}function wrap(c,t,x,y,max,l){let words=t.split(' '),line='';for(let i=0;i<words.length;i++){let test=line+words[i]+' ';if(c.measureText(test).width>max&&i>0){c.fillText(line,x,y);line=words[i]+' ';y+=l}else line=test}c.fillText(line,x,y)}
templates.forEach(t=>{let b=document.createElement('button');b.className='tpl';b.innerHTML=`<div class='thumb' style='background:linear-gradient(135deg,${t[1]},${t[2]})'></div>${t[0]}`;b.onclick=()=>{bg1=t[1];bg2=t[2];title.value=t[3];subtitle.value=t[4];img=null;draw()};document.getElementById('templates').appendChild(b)});['#7c3aed','#2563eb','#059669','#dc2626','#111827','#f59e0b','#db2777'].forEach(c=>{let b=document.createElement('button');b.className='color';b.style.background=c;b.onclick=()=>{bg1=c;bg2=c;draw()};document.getElementById('colors').appendChild(b)});title.oninput=subtitle.oninput=draw;image.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{img=new Image();img.onload=draw;img.src=r.result};r.readAsDataURL(f)};download.onclick=()=>{let a=document.createElement('a');a.download='dzdesign.png';a.href=canvas.toDataURL('image/png');a.click()};draw();
</script></body></html>
